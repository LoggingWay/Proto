syntax = "proto3";

package combat_events;
option go_package = "gen/combat_events";
option csharp_namespace = "LoggingWayPlugin.Proto";

// Main combat event message
//Combat event should map to a game event happening either via packet receive or as part
//of the game processing it
message CombatEvent {
  int64 timestamp_epoch_ms = 1;
  Entity source = 2;
  Entity target = 3;
  EventSnapshot source_snapshot = 4;
  EventSnapshot target_snapshot = 5;
  LocalPlayerSnapshot local_snapshot = 6;//Im so tired but fuck it this is certainly a good idea111111111111
  // Discriminated union using oneof
  oneof event_data {
    StatusEffectData status_effect = 10;
    HoTData hot = 11;
    DoTData dot = 12;
    DamageTakenData damage_taken = 13;
    HealedData healed = 14;
    DeathData death = 15;
    EncounterStartData encounter_start = 16;
    EncounterEndData encounter_end = 17;
    ZoneChangeData zone_change = 18;
    PlayerEnterCombat player_join = 19;
  }
}

message Entity {
  uint64 gameobject_id = 1;
  uint32 base_id = 2;
  ObjectKind objectkind = 3;
}
message EventSnapshot {
  uint32 current_hp = 1;
  uint32 max_hp = 2;
  repeated StatusEffectSnapshot status_effects = 3;
  uint32 barrier_percent = 4;
}

message StatusEffectSnapshot {
  uint32 id = 1;
  uint32 source_id = 2;
  uint32 stack_count = 3;
}

// Event-specific data types
message StatusEffectData {
  uint32 id = 1;
  uint32 stack_count = 2;
  uint32 icon = 3;  // 0 means null
  float duration = 4;
  StatusCategory category = 5;
}

message HoTData {
  uint32 amount = 1;
}

message DoTData {
  uint32 amount = 1;
}

message DamageTakenData {
  uint32 amount = 1;
  uint32 action_id = 2;
  bool crit = 3;
  bool direct_hit = 4;
  DamageType damage_type = 5;
  ActionType display_type = 6;
  bool parried = 7;
  bool blocked = 8;
  uint32 icon = 9;  // 0 means null
  bool main_target = 10;
}

message HealedData {
  uint32 amount = 1;
  uint32 action_id = 2;
  bool crit = 3;
  uint32 icon = 4;  // 0 means null
}

message DeathData {
  // Empty message for death events
}

message EncounterStartData {
  uint32 territorytype = 1;
  uint32 cfc_id = 2;//content finder id
}

message EncounterEndData {
  uint32 territorytype = 1;
  EncounterEndKind reason = 2;
  uint32 cfc_id = 3;
}

message ZoneChangeData{
    uint32 territorytype = 1;
}


//Gauge related messages
message BlackMageGauge{
  bool InAstralFire = 1;
  bool InUmbralIce = 2;
  bool IsEnochianActive = 3;
  byte UmbralHearts = 4;
  byte PolyglotStacks = 5;
  byte UmbralIceStacks = 6;
  byte AstralFireStacks = 7;
  int AstralSoulStacks = 8;//Flare Star counter
}

// AST - Astrologian
message AstrologianGauge {
  repeated CardType drawn_cards  = 1;
  CardType          drawn_crown_card = 2;
  DrawType          active_draw  = 3;
}

// BRD - Bard
message BardGauge {
  uint32       song_timer = 1; // milliseconds
  uint32       repertoire = 2;
  uint32       soul_voice = 3;
  Song         song       = 4;
  Song         last_song  = 5;
  repeated Song coda      = 6; // always 3 entries
}

// DNC - Dancer
message DancerGauge {
  uint32          feathers        = 1;
  uint32          esprit          = 2;
  uint32          completed_steps = 3;
  repeated uint32 steps           = 4; // action IDs, always 4 entries
  uint32          next_step       = 5; // action ID
  bool            is_dancing      = 6;
}

// DRG - Dragoon
message DragoonGauge {
  int32  lotd_timer             = 1; // Life of the Dragon, milliseconds
  bool   is_lotd_active         = 2;
  uint32 eye_count              = 3;
  uint32 firstminds_focus_count = 4;
}

// DRK - Dark Knight
message DarkKnightGauge {
  uint32       blood                   = 1;
  uint32       darkside_time_remaining = 2; // milliseconds
  uint32       shadow_time_remaining   = 3; // milliseconds
  bool         has_dark_arts           = 4;
  DeliriumStep delirium_combo_step     = 5;
}

// GNB - Gunbreaker
message GunbreakerGauge {
  uint32 ammo               = 1;
  int32  max_timer_duration = 2; // Gnashing Fang combo max
  uint32 ammo_combo_step    = 3;
}

// MCH - Machinist
message MachinistGauge {
  int32  overheat_time_remaining   = 1; // milliseconds
  int32  summon_time_remaining     = 2; // Rook/Queen, milliseconds
  uint32 heat                      = 3;
  uint32 battery                   = 4;
  uint32 last_summon_battery_power = 5;
  bool   is_overheated             = 6;
  bool   is_robot_active           = 7;
}

// MNK - Monk
// nadi is stored as uint32 to support combined flag values (e.g. Lunar|Solar = 3)
message MonkGauge {
  uint32               chakra               = 1;
  repeated BeastChakra beast_chakra         = 2; // always 3 entries
  uint32               nadi                 = 3; // Nadi bitmask (None=0, Lunar=1, Solar=2, Both=3)
  uint32               opo_opo_fury         = 4;
  uint32               raptor_fury          = 5;
  uint32               coeurl_fury          = 6;
  uint32               blitz_time_remaining = 7; // milliseconds
}

// NIN - Ninja
message NinjaGauge {
  uint32 ninki     = 1;
  uint32 kazematoi = 2;
}

// PCT - Pictomancer
// creature_flags and canvas_flags stored as uint32 to support combined bitmask values
message PictomancerGauge {
  uint32 pallete_gauge         = 1;
  uint32 paint                 = 2;
  bool   creature_motif_drawn  = 3;
  bool   weapon_motif_drawn    = 4;
  bool   landscape_motif_drawn = 5;
  bool   moogle_portrait_ready = 6;
  bool   madeen_portrait_ready = 7;
  uint32 creature_flags        = 8; // CreatureFlags bitmask
  uint32 canvas_flags          = 9; // CanvasFlags bitmask
}

// PLD - Paladin
message PaladinGauge {
  uint32 oath_gauge = 1;
}

// RDM - Red Mage
message RedMageGauge {
  uint32 white_mana  = 1;
  uint32 black_mana  = 2;
  uint32 mana_stacks = 3;
}

// RPR - Reaper
message ReaperGauge {
  uint32 soul                      = 1;
  uint32 shroud                    = 2;
  uint32 enshrouded_time_remaining = 3; // milliseconds
  uint32 lemure_shroud             = 4;
  uint32 void_shroud               = 5;
}

// SAM - Samurai
// sen stored as uint32 to support combined flag values (e.g. Setsu|Getsu = 3)
message SamuraiGauge {
  Kaeshi kaeshi            = 1;
  uint32 kenki             = 2;
  uint32 meditation_stacks = 3;
  uint32 sen               = 4; // Sen bitmask (Setsu=1, Getsu=2, Ka=4)
  bool   has_setsu         = 5;
  bool   has_getsu         = 6;
  bool   has_ka            = 7;
}

// SCH - Scholar
message ScholarGauge {
  uint32        aetherflow     = 1;
  uint32        fairy_gauge    = 2;
  int32         seraph_timer   = 3; // milliseconds
  DismissedFairy dismissed_fairy = 4;
}

// SGE - Sage
message SageGauge {
  int32  addersgall_timer = 1; // milliseconds, 0-20000
  uint32 addersgall       = 2;
  uint32 addersting       = 3;
  bool   eukrasia         = 4;
}

// SMN - Summoner
message SummonerGauge {
  uint32           summon_timer_remaining     = 1;  // milliseconds
  uint32           attunement_timer_remaining = 2;  // milliseconds
  SummonPet        return_summon              = 3;
  PetGlam          return_summon_glam         = 4;
  uint32           attunement_count           = 5;
  SummonAttunement attunement_type            = 6;
  uint32           aether_flags              = 7;  // AetherFlags bitmask (from FFXIVClientStructs)
  bool             is_bahamut_ready           = 8;
  bool             is_phoenix_ready           = 9;
  bool             is_ifrit_ready             = 10;
  bool             is_titan_ready             = 11;
  bool             is_garuda_ready            = 12;
  bool             is_ifrit_attuned           = 13;
  bool             is_titan_attuned           = 14;
  bool             is_garuda_attuned          = 15;
  bool             has_aetherflow_stacks      = 16;
  uint32           aetherflow_stacks          = 17;
}

// VPR - Viper
message ViperGauge {
  uint32       rattling_coil_stacks = 1; // Uncoiled Fury uses
  uint32       serpent_offering     = 2;
  uint32       anguine_tribute      = 3; // Generation/Ouroboros tracker
  DreadCombo   dread_combo          = 4;
  SerpentCombo serpent_combo        = 5;
}

// WAR - Warrior
message WarriorGauge {
  uint32 beast_gauge = 1;
}

// WHM - White Mage
message WhiteMageGauge {
  int32  lily_timer = 1; // milliseconds
  uint32 lily       = 2;
  uint32 blood_lily = 3;
}

/* =======================
   Utility
   ======================= */
//Utility messages does not map to a game event
//They are used to help the backend parser and prevent certain field that only needs to be known once

message PlayerEnterCombat{
  string name = 1;
  uint32 homeworld_id = 2;;
  uint64 content_id = 3;
  uint64 gameobject_id = 4;
  uint32 job_id = 5;
  uint32 level = 6;
  uint32 attack_power = 7;
  uint32 skillspeed = 8;
  uint32 spellspeed = 9;
  uint32 tenacity = 10;
  uint32 determination = 11;
  uint32 criticalHit = 12;
  uint32 directHit = 13;
  uint32 weapon_damage = 14;
}
message LocalPlayerSnapshot{
  uint32 attack_power = 7;
  uint32 skillspeed = 8;
  uint32 spellspeed = 9;
  uint32 tenacity = 10;
  uint32 determination = 11;
  uint32 criticalHit = 12;
  uint32 directHit = 13;
}
