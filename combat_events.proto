//rpc
service Loggingway {

//generate a xivauth redirect
rpc GetXivAuthRedirect (GetXivAuthRedirectRequest) returns (GetXivAuthRedirectReply) {}
//client send a code from xivauth, gets a sessionID
rpc Login (LoginRequest) returns (LoginReply) {}
rpc SessionRefresh (SessionRefreshRequest) returns (SessionRefreshReply) {}
rpc Logout (LogoutRequest) returns (LogoutReply) {}

rpc CreateNewReport (NewReportRequest) returns (NewReportReply) {}

rpc EncounterIngest (NewEncounterRequest) returns (NewEncounterReply) {}

rpc GetMyCharacters (GetMyCharactersRequest) returns (GetMyCharactersReply) {}
rpc GetMyReports (GetMyReportsRequest) returns (GetMyReportsReply) {}
rpc GetMyEncounters (GetMyEncountersRequest) returns (GetMyEncountersReply) {}
rpc GetEncountersStats (GetEncountersStatsRequest) returns (GetEncountersStatsReply) {}
rpc EnrollCharacters (EnrollCharactersRequest) returns (EnrollCharactersReply) {}
rpc GetLeaderBoard (GetLeaderBoardRequest) returns (GetLeaderBoardReply) {}
rpc CombatEventIngest(stream combat_events.CombatEvent) returns (CombatEventIngestReturn) {}
rpc PollJobResult (PollJobResultRequest) returns (PollJobResultReply) {}
}

//Declared in order, Request > Reply
message GetXivAuthRedirectRequest{
    
}

message GetXivAuthRedirectReply{
    string xivauthuri = 1;//state is included in the uri
}

message LoginRequest{
    string code = 1;
    string state = 2;
}

message LoginReply{
    string sessionID = 1;
    int32 code = 2;
}

message SessionRefreshRequest{
}

message SessionRefreshReply{
  string sessionID = 1;
}

message LogoutRequest{
}

message LogoutReply{
}

message NewReportRequest{
    uint32 visbility = 1;
}

message NewReportReply{
    int64 reportid = 1;
}

message NewEncounterRequest{
    repeated combat_events.CombatEvent events = 1;
    uint32 cfc_id = 2;
}

message NewEncounterReply{
    string jobid = 1;
    int64 queued_at = 2;//UnixTimeSeconds
}

message GetMyCharactersRequest {
    //sessionID is included as metadata anyway
}
message GetMyCharactersReply{
    repeated Character characters = 1;
}

message GetMyReportsRequest{
    //saaaaaame
}
message GetMyReportsReply{
    repeated Report reports = 1;
}
message GetMyEncountersRequest{
    uint32 cfc_id = 1;//if this is 0, return the last 20 encounters regardless of cfc
}
message GetMyEncountersReply{
    repeated Encounter encounters = 1;
}
message GetEncountersStatsRequest{
    int64 encounter_id = 1;
}
message GetEncountersStatsReply{
    EncounterPlayerBreakdown playerstats = 1;
}
message EnrollCharactersRequest{
    string code = 1;
    string state = 2;
}
message EnrollCharactersReply{
  
}

message GetLeaderBoardRequest{
  uint32 cfc_id = 1;
  uint32 job_id = 2;//0=all jobs
}

message GetLeaderBoardReply{
  repeated LeaderBoardEntry entry = 1;
  int64 totalRanked = 2;
}

message PollJobResultRequest  { 
  string job_id = 1; //where job id is server side job id of the parse in the queue
  }
message PollJobResultReply {
    bool  ready       = 1;
    int64 encounter_id = 2;
    int64 rank         = 3;
    int64 total_ranked = 4;
    float pscore       = 5;
    string error       = 6;
}
//types
message Character{
    string name = 1;
    string homeworld = 2;
    string datacenter = 3;
    string persistent_key = 4;
    uint32 visbility = 5;
}

message Report{
    int64 report_id = 1;
    string report_name = 2;
    repeated Encounter encounters = 3;
}
message Encounter{
    int64 encounter_id = 1;
    uint32 cfc_id = 2;
    int64 uploaded_at = 3;
}

message EncounterPlayerBreakdown{
    string name = 1;
    int64 total_damage = 2;
    int64 total_healing = 3;

    int64 total_hits = 4;
    int64 total_crits = 5;
    int64 total_direct_hits = 6;
    float duration = 7;

    float dps =8;
    float hps =9;
    float crit_rate =10;
    float dh_rate =11;
    float pscore = 12;
    uint32 job_id = 13;
    int64 rank = 14;        // 0 = unranked (failed to process/deleted)
    int64 total_ranked = 15; // total players ranked
    int64 global_rank = 16;
    int64 global_total_rank = 17;
}
message LeaderBoardEntry{
  Character char = 1;
  int64 rank = 2;
  float psccore = 3;
  uint32 jobid = 4;
}
message CombatEventIngestReturn{
  uint32 code = 1;
}
